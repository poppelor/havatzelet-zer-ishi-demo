<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>קבלת סחורה | משתלת חבצלת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>.wrap { padding-bottom: calc(160px + var(--safe-bottom)); }</style>
</head>
<body>
  <div class="wrap" id="form-view">
    <header class="top">
      <p class="nav-home"><a href="./">כל הטפסים</a></p>
      <h1>קבלת סחורה</h1>
      <p class="subhead">דמו · שמות לדוגמה · עלות לפני מע״מ</p>
    </header>
    
    <div class="card compact">
      <div class="inline-row">
        <div>
          <div class="label" id="supplier-label">ספק</div>
          <div class="chips" role="group" aria-labelledby="supplier-label">
            <button type="button" class="chip" data-supplier="פרחי כרמי" aria-pressed="true">פרחי כרמי</button>
            <button type="button" class="chip" data-supplier="other" aria-pressed="false">אחר</button>
          </div>
        </div>
        <div>
          <label class="label" for="note-number">מספר תעודה</label>
          <input id="note-number" type="text" placeholder="מספר" />
        </div>
      </div>
      <div id="supplier-other-wrap" style="display:none;margin-top:6px">
        <input id="supplier-other" type="text" maxlength="80" placeholder="שם הספק" />
      </div>
    </div>
    <div class="card table-card">
      <div id="recv-table" class="grid-recv"></div>
      <button type="button" class="add-btn" id="add-extra">+ הוספת פריט חדש</button>
    </div>
    <div class="card compact">
      <div class="inline-row">
        <div>
          <label class="label" for="note-total">סה״כ בתעודה (₪, לפני מע״מ)</label>
          <input id="note-total" type="number" inputmode="decimal" min="0" step="0.01" />
        </div>
        <div>
          <label class="check-row" style="margin-top:18px">
            <input type="checkbox" id="matches" />
            <span>התעודה תואמת</span>
          </label>
        </div>
      </div>
      <p class="hint" id="mismatch-hint" style="display:none;margin-top:6px"></p>
      <div id="mismatch-notes-wrap" style="margin-top:6px">
        <input id="mismatch-notes" type="text" placeholder="הערות אם יש אי-התאמה" />
      </div>
    </div>
    <div class="card compact">
      <div class="inline-row">
        <div>
          <label class="label">צילום התעודה</label>
          <label class="photo-box" for="photo">הוספת צילום
            <input id="photo" type="file" accept="image/*" />
          </label>
          <div id="photo-actions" style="display:none">
            <button type="button" class="remove-btn" id="remove-photo">×</button>
          </div>
        </div>
        <div>
          <label class="label" for="notes">הערות</label>
          <input id="notes" type="text" placeholder="לא חובה" />
        </div>
      </div>
      <img id="preview" class="photo-preview" alt="תצוגה מקדימה של התעודה" />
    </div>
    
    <div class="card compact">
      <div class="meta">
        <div>
          <label class="label" for="date">תאריך</label>
          <input id="date" type="date" required />
        </div>
        <div>
          <div class="label" id="who-label">מי ממלאת</div>
          <div class="who" role="group" aria-labelledby="who-label">
            <button type="button" data-who="אורלי" aria-pressed="false">אורלי</button>
            <button type="button" data-who="עומר" aria-pressed="false">עומר</button>
          </div>
        </div>
      </div>
    </div>


    <p class="error" id="error" role="alert"></p>
  </div>
  <div class="dock" id="dock">
    <div class="dock-inner">
      <p class="sub" id="sub">סה״כ בתעודה: לא מולא</p>
      <div class="sticker" id="sticker" aria-live="polite">סה״כ מחושב: ₪0</div>
      <button type="button" class="submit" id="submit">שליחת הדיווח</button>
    </div>
  </div>
  <div class="wrap success" id="success-view">
    <header class="top">
      <h1 id="success-title">הדיווח מוכן</h1>
      <p class="subhead">דמו · שמות ומחירים לדוגמה</p>
    </header>
    <div class="card"><ul class="summary" id="summary"></ul></div>
    <p class="note-limit" id="save-note"></p>
    <button type="button" class="again" id="again">דיווח נוסף</button>
    <a class="home-btn" href="./">חזרה לכל הטפסים</a>
  </div>
  <script src="app-common.js"></script>
  <script>
  
    (function () {
      const H = Havatzelet;
      let who = "";
      let supplier = "פרחי כרמי";
      let photo = { name: "", dataUrl: "" };
      const lines = {};
      H.STEMS.forEach(function (s) { lines[s.name] = { qty: 0, cost: "" }; });
      let extras = [];

      document.getElementById("date").value = H.todayISO();
      H.bindWho(function () { return who; }, function (v) { who = v; });
      H.bindPhoto("photo", "preview", "photo-actions", "remove-photo", function (p) { photo = p; });

      document.querySelectorAll("[data-supplier]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          supplier = btn.getAttribute("data-supplier");
          document.querySelectorAll("[data-supplier]").forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          document.getElementById("supplier-other-wrap").style.display = supplier === "other" ? "block" : "none";
          H.hideError();
        });
      });

      const table = document.getElementById("recv-table");

      function addHead() {
        [["name","פריט"],["","כמות"],["","עלות"],["sum","סכום"]].forEach(function (t) {
          const el = document.createElement("div");
          el.className = "th" + (t[0] ? " " + t[0] : "");
          el.textContent = t[1];
          table.appendChild(el);
        });
      }

      function mountStem(s) {
        const state = lines[s.name];
        const nameCel = document.createElement("div");
        nameCel.className = "td name";
        nameCel.textContent = s.name;
        table.appendChild(nameCel);

        const qtyCel = document.createElement("div");
        qtyCel.className = "td cell stem";
        qtyCel.setAttribute("data-stem", s.id);
        const qtyIn = H.makeQtyInput(state.qty, function (next) {
          state.qty = next;
          updateStemSum(s);
          renderBar();
        }, "כמות " + s.name);
        qtyIn.id = "qty-" + s.id;
        qtyCel.appendChild(qtyIn);
        table.appendChild(qtyCel);

        const costCel = document.createElement("div");
        costCel.className = "td cell";
        const cost = document.createElement("input");
        cost.className = "cost-in";
        cost.type = "number";
        cost.inputMode = "decimal";
        cost.min = "0";
        cost.step = "0.01";
        cost.placeholder = "₪";
        cost.id = "cost-" + s.id;
        cost.value = state.cost;
        cost.addEventListener("input", function () {
          state.cost = cost.value;
          updateStemSum(s);
          renderBar();
        });
        costCel.appendChild(cost);
        table.appendChild(costCel);

        const sumCel = document.createElement("div");
        sumCel.className = "td sum";
        sumCel.id = "line-" + s.id;
        sumCel.textContent = "₪0";
        table.appendChild(sumCel);
      }

      function updateStemSum(s) {
        const el = document.getElementById("line-" + s.id);
        if (el) el.textContent = "₪" + H.money(stemSum(s.name));
      }

      function remountExtras() {
        const keep = 4 + H.STEMS.length * 4;
        while (table.children.length > keep) table.removeChild(table.lastChild);
        extras.forEach(function (row, i) { mountExtra(row, i); });
      }

      function mountExtra(state, i) {
        const nameCel = document.createElement("div");
        nameCel.className = "td name";
        nameCel.style.display = "flex";
        nameCel.style.alignItems = "center";
        nameCel.style.gap = "2px";
        const inp = document.createElement("input");
        inp.className = "name-in";
        inp.type = "text";
        inp.maxLength = 80;
        inp.placeholder = "שם פריט";
        inp.value = state.name || "";
        inp.addEventListener("input", function () { extras[i].name = inp.value; });
        const rm = document.createElement("button");
        rm.type = "button";
        rm.className = "remove-btn";
        rm.textContent = "×";
        rm.setAttribute("aria-label", "הסרת הפריט");
        rm.addEventListener("click", function () {
          extras.splice(i, 1);
          remountExtras();
          renderBar();
        });
        nameCel.appendChild(inp);
        nameCel.appendChild(rm);
        table.appendChild(nameCel);

        const qtyCel = document.createElement("div");
        qtyCel.className = "td cell";
        const qtyIn = H.makeQtyInput(state.qty, function (next) {
          extras[i].qty = next;
          updateExSum(i);
          renderBar();
        }, "כמות פריט נוסף");
        qtyCel.appendChild(qtyIn);
        table.appendChild(qtyCel);

        const costCel = document.createElement("div");
        costCel.className = "td cell";
        const cost = document.createElement("input");
        cost.className = "cost-in";
        cost.type = "number";
        cost.inputMode = "decimal";
        cost.min = "0";
        cost.step = "0.01";
        cost.placeholder = "₪";
        cost.value = state.cost || "";
        cost.addEventListener("input", function () {
          extras[i].cost = cost.value;
          updateExSum(i);
          renderBar();
        });
        costCel.appendChild(cost);
        table.appendChild(costCel);

        const sumCel = document.createElement("div");
        sumCel.className = "td sum";
        sumCel.id = "exsum-" + i;
        sumCel.textContent = "₪" + H.money((Number(state.qty)||0)*(Number(state.cost)||0));
        table.appendChild(sumCel);
      }

      function updateExSum(i) {
        const el = document.getElementById("exsum-" + i);
        const row = extras[i];
        if (el && row) el.textContent = "₪" + H.money((Number(row.qty)||0)*(Number(row.cost)||0));
      }

      document.getElementById("add-extra").addEventListener("click", function () {
        extras.push({ name: "", qty: 0, cost: "" });
        remountExtras();
      });
      document.getElementById("note-total").addEventListener("input", renderBar);

      function supplierName() {
        if (supplier === "other") return document.getElementById("supplier-other").value.trim();
        return supplier;
      }
      function extraSum() {
        return extras.reduce(function (s, r) { return s + (Number(r.qty)||0) * (Number(r.cost)||0); }, 0);
      }
      function stemSum(name) {
        return (lines[name].qty || 0) * (Number(lines[name].cost) || 0);
      }
      function grand() {
        return H.STEMS.reduce(function (s, st) { return s + stemSum(st.name); }, 0) + extraSum();
      }
      function noteTotal() {
        const v = document.getElementById("note-total").value;
        if (v === "") return null;
        return Number(v);
      }
      function mismatch() {
        const n = noteTotal();
        if (n === null || Number.isNaN(n)) return false;
        return Math.round(n * 100) !== Math.round(grand() * 100);
      }
      function extraText() {
        return extras.filter(function (r) { return r.name || r.qty || r.cost; }).map(function (r) {
          const q = Number(r.qty)||0, c = Number(r.cost)||0;
          return (r.name || "פריט") + " · " + q + " × ₪" + H.money(c) + " = ₪" + H.money(q*c);
        }).join(" ; ");
      }
      function hasQty() {
        const stemQty = H.STEMS.some(function (s) { return lines[s.name].qty > 0; });
        const exQty = extras.some(function (r) { return (Number(r.qty)||0) > 0; });
        return stemQty || exQty;
      }
      function renderBar() {
        document.getElementById("sticker").textContent = "סה״כ מחושב: ₪" + H.money(grand());
        const sub = document.getElementById("sub");
        const hint = document.getElementById("mismatch-hint");
        const n = noteTotal();
        if (n === null || Number.isNaN(n)) {
          sub.textContent = "סה״כ בתעודה: לא מולא";
          sub.className = "sub";
          hint.style.display = "none";
        } else if (mismatch()) {
          const diff = grand() - n;
          const sign = diff > 0 ? "+" : "";
          sub.textContent = "לא תואם לתעודה · הפרש " + sign + "₪" + H.money(diff);
          sub.className = "sub warn";
          hint.style.display = "block";
          hint.textContent = "הסכום שחושב (₪" + H.money(grand()) + ") שונה מהסכום בתעודה (₪" + H.money(n) + ").";
        } else {
          sub.textContent = "תואם לתעודה: ₪" + H.money(n);
          sub.className = "sub";
          hint.style.display = "none";
        }
      }
      function fields() {
        const n = noteTotal();
        const g = grand();
        const diff = (n === null || Number.isNaN(n)) ? "" : Math.round((g - n) * 100) / 100;
        const f = {
          "תאריך": document.getElementById("date").value,
          "מי מילא": who,
          "ספק": supplierName(),
          "מספר תעודת משלוח": document.getElementById("note-number").value.trim(),
          "פריטים נוספים": extraText(),
          "סה\"כ מחושב": g,
          "סה\"כ בתעודה": (n === null || Number.isNaN(n)) ? "" : n,
          "הפרש": diff,
          "התעודה תואמת": document.getElementById("matches").checked ? "כן" : "לא",
          "הערות אי-התאמה": document.getElementById("mismatch-notes").value.trim(),
          "הערות": document.getElementById("notes").value.trim(),
          "צילום": photo.name || (photo.dataUrl ? "צילום" : "")
        };
        H.STEMS.forEach(function (s) {
          f[s.name + " - כמות"] = lines[s.name].qty;
          f[s.name + " - עלות יחידה"] = lines[s.name].cost === "" ? "" : Number(lines[s.name].cost);
          f[s.name + " - סכום"] = stemSum(s.name);
        });
        return f;
      }
      function summaryLines() {
        const out = [
          ["תאריך", document.getElementById("date").value],
          ["מי מילאה", who],
          ["ספק", supplierName()],
          ["מספר תעודה", document.getElementById("note-number").value.trim()]
        ];
        H.STEMS.forEach(function (s) {
          if (lines[s.name].qty) out.push([s.name, lines[s.name].qty + " × ₪" + H.money(Number(lines[s.name].cost)||0)]);
        });
        if (extraText()) out.push(["פריטים נוספים", extraText()]);
        out.push(["סה״כ מחושב", "₪" + H.money(grand())]);
        const n = noteTotal();
        if (n !== null && !Number.isNaN(n)) out.push(["סה״כ בתעודה", "₪" + H.money(n)]);
        out.push(["התעודה תואמת", document.getElementById("matches").checked ? "כן" : "לא"]);
        const mm = document.getElementById("mismatch-notes").value.trim();
        if (mm) out.push(["הערות אי-התאמה", mm]);
        const notes = document.getElementById("notes").value.trim();
        if (notes) out.push(["הערות", notes]);
        if (photo.name || photo.dataUrl) out.push(["צילום", "צורף"]);
        return out;
      }

      document.getElementById("submit").addEventListener("click", function () {
        if (!who) return H.showError("צריך לבחור מי ממלאת: אורלי או עומר.");
        if (!supplierName()) return H.showError("צריך למלא את שם הספק.");
        if (!hasQty()) return H.showError("צריך למלא כמות לפחות לפריט אחד.");
        if (mismatch() && !document.getElementById("matches").checked && !document.getElementById("mismatch-notes").value.trim()) {
          return H.showError("הסכומים לא תואמים. צריך לסמן שהתעודה תואמת, או לכתוב מה לא תאם.");
        }
        H.hideError();
        const btn = document.getElementById("submit");
        btn.disabled = true; btn.textContent = "שולחת…";
        H.submit("receiving", fields(), photo)
          .then(function () { H.showSuccess(summaryLines(), true); })
          .catch(function () { H.showError("השליחה לגיליון לא הצליחה. אם זו הפעם הראשונה לטופס הזה, צריך לפרוס מחדש את הסקריפט."); })
          .finally(function () { btn.disabled = false; btn.textContent = "שליחת הדיווח"; });
      });
      document.getElementById("again").addEventListener("click", function () { location.reload(); });

      table.innerHTML = "";
      addHead();
      H.STEMS.forEach(mountStem);
      renderBar();
    })();

  </script>
</body>
</html>
