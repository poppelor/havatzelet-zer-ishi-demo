<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="זר אישי — דמו" />
  <title>זר בהתאמה אישית — דמו | משתלת חבצלת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3eee4;
      --paper: #fffdf8;
      --ink: #1c2b21;
      --muted: #5d6b60;
      --line: #e4ddd2;
      --green: #2f5d3a;
      --green-dark: #244830;
      --green-soft: #e7f0e8;
      --rose: #8a3a32;
      --warn-bg: #fff4d6;
      --warn-ink: #6b4e00;
      --shadow: 0 8px 24px rgba(28, 43, 33, 0.08);
      --radius: 18px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Assistant, "Segoe UI", "Arial Hebrew", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.45;
    }
    body { min-height: 100dvh; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 8px 10px calc(210px + var(--safe-bottom));
    }
    header.top { padding: 8px 2px 4px; }
    .nav-home { margin: 0 0 8px; }
    .nav-home a { color: var(--green); font-weight: 700; font-size: 14px; text-decoration: none; }
    .brand { display: none; }
    h1 {
      margin: 2px 0 0;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 800;
    }
    .badge { display: none; }
    .subhead {
      margin: 1px 0 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .banner { display: none; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin: 0 0 14px;
      box-shadow: var(--shadow);
    }
    .card.compact {
      padding: 10px 12px;
      box-shadow: none;
    }
    .label {
      display: block;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .hint { color: var(--muted); font-size: 14px; font-weight: 400; }
    input[type="date"],
    input[type="number"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 16px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    .compact input[type="date"] {
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      min-height: 40px;
    }
    input[type="date"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(47, 93, 58, 0.15);
    }
    textarea { min-height: 80px; resize: vertical; }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: end;
    }
    .meta .who { display: flex; gap: 6px; }
    .meta .who button,
    .who button {
      flex: 1;
      min-height: 44px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: #fff;
      font-weight: 700;
      font-size: 16px;
    }
    .compact .who button { min-height: 40px; font-size: 15px; }
    .who button[aria-pressed="true"],
    .chip[aria-pressed="true"] {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green-dark);
    }
    .stem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .stem:first-of-type { border-top: 0; padding-top: 2px; }
    .stem-name { font-weight: 700; }
    .stem-price { color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 2px; }
    .stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .stepper button {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 2px solid var(--green);
      background: #fff;
      color: var(--green);
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      padding: 0;
    }
    .stepper button:active { background: var(--green-soft); }
    .stepper .qty {
      min-width: 32px;
      text-align: center;
      font-weight: 800;
      font-size: 22px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: #fff;
      font-weight: 700;
      font-size: 16px;
    }
    .reason-chip {
      flex: 1 1 calc(50% - 8px);
      min-height: 48px;
      text-align: center;
    }
    .custom-pct { display: none; margin-top: 10px; }
    .custom-reason { display: none; margin-top: 10px; }
    .error {
      display: none;
      margin: 0 0 12px;
      color: var(--rose);
      font-weight: 700;
      font-size: 15px;
    }
    .dock {
      position: fixed;
      right: 0;
      left: 0;
      bottom: 0;
      background: rgba(255, 253, 248, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--line);
      padding: 10px 16px calc(12px + var(--safe-bottom));
    }
    .dock-inner { max-width: 430px; margin: 0 auto; }
    .raw { margin: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
    .discount-line { margin: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
    .sticker {
      margin: 2px 0 10px;
      font-size: 26px;
      line-height: 1.15;
      font-weight: 800;
      color: var(--rose);
    }
    .submit {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 16px;
      background: var(--green);
      color: #fff;
      font-weight: 800;
      font-size: 20px;
    }
    .submit:disabled { opacity: 0.55; }
    .submit:active { background: var(--green-dark); }
    .success { display: none; }
    .success h1 { margin-top: 12px; }
    .summary { list-style: none; margin: 0; padding: 0; }
    .summary li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
    }
    .again {
      width: 100%;
      min-height: 52px;
      margin-top: 16px;
      border-radius: 16px;
      border: 2px solid var(--green);
      background: #fff;
      color: var(--green-dark);
      font-weight: 800;
    }
    .note-limit {
      margin-top: 14px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap" id="form-view">
    <header class="top">
      <p class="nav-home"><a href="./">כל הטפסים</a></p>
      <h1>זר בהתאמה אישית</h1>
      <p class="subhead">דמו · מחירים לדוגמה</p>
    </header>

    <div class="card">
      <div class="label">ענפים <span class="hint">מחירים לדוגמה</span></div>
      <div class="stem" data-stem="rose">
        <div>
          <div class="stem-name">ורד אדום</div>
          <div class="stem-price">₪15 לענף</div>
        </div>
        <div class="stepper">
          <button type="button" class="minus" aria-label="הורדת כמות ורד אדום">−</button>
          <div class="qty" aria-live="polite">0</div>
          <button type="button" class="plus" aria-label="הוספת ורד אדום">+</button>
        </div>
      </div>
      <div class="stem" data-stem="lisianthus">
        <div>
          <div class="stem-name">ליזיאנטוס</div>
          <div class="stem-price">₪15 לענף</div>
        </div>
        <div class="stepper">
          <button type="button" class="minus" aria-label="הורדת כמות ליזיאנטוס">−</button>
          <div class="qty" aria-live="polite">0</div>
          <button type="button" class="plus" aria-label="הוספת ליזיאנטוס">+</button>
        </div>
      </div>
      <div class="stem" data-stem="greenery">
        <div>
          <div class="stem-name">ירק</div>
          <div class="stem-price">₪6 לענף</div>
        </div>
        <div class="stepper">
          <button type="button" class="minus" aria-label="הורדת כמות ירק">−</button>
          <div class="qty" aria-live="polite">0</div>
          <button type="button" class="plus" aria-label="הוספת ירק">+</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="label">הנחה <span class="hint">לא חובה</span></div>
      <div class="chips" id="pct-chips" role="group" aria-label="אחוז הנחה">
        <button type="button" class="chip" data-pct="10" aria-pressed="false">10%</button>
        <button type="button" class="chip" data-pct="20" aria-pressed="false">20%</button>
        <button type="button" class="chip" data-pct="30" aria-pressed="false">30%</button>
        <button type="button" class="chip" data-pct="50" aria-pressed="false">50%</button>
        <button type="button" class="chip" data-pct="custom" aria-pressed="false">אחר</button>
      </div>
      <div class="custom-pct" id="custom-pct-wrap">
        <label class="label" for="custom-pct">אחוז הנחה</label>
        <input id="custom-pct" type="number" inputmode="numeric" min="1" max="100" step="1" placeholder="למשל 15" />
      </div>
      <div id="reason-block" style="display:none; margin-top:14px">
        <div class="label" id="reason-label">סיבת ההנחה</div>
        <div class="chips" role="group" aria-labelledby="reason-label">
          <button type="button" class="chip reason-chip" data-reason="זר ישן" aria-pressed="false">זר ישן</button>
          <button type="button" class="chip reason-chip" data-reason="פרחים קצת פגומים" aria-pressed="false">פרחים קצת פגומים</button>
          <button type="button" class="chip reason-chip" data-reason="לקוח קבוע" aria-pressed="false">לקוח קבוע</button>
          <button type="button" class="chip reason-chip" data-reason="אחר" aria-pressed="false">אחר</button>
        </div>
        <div class="custom-reason" id="custom-reason-wrap">
          <label class="label" for="custom-reason">פירוט</label>
          <input id="custom-reason" type="text" maxlength="120" placeholder="למה ניתנה ההנחה" style="width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:16px;outline:none" />
        </div>
      </div>
    </div>

    <div class="card">
      <label class="label" for="final-price">מחיר סופי שנכתב על המדבקה</label>
      <input id="final-price" type="number" inputmode="numeric" min="0" step="1" />
      <div class="hint" style="margin-top:8px">ממולא אוטומטית לפי החישוב. אפשר לתקן ידנית.</div>
    </div>

    <div class="card">
      <label class="label" for="notes">הערות <span class="hint">לא חובה</span></label>
      <textarea id="notes" placeholder="משהו חשוב על הזר הזה"></textarea>
    </div>

    <div class="card compact">
      <div class="meta">
        <div>
          <label class="label" for="date" style="font-size:13px;margin-bottom:6px">תאריך</label>
          <input id="date" type="date" required />
        </div>
        <div>
          <div class="label" id="who-label" style="font-size:13px;margin-bottom:6px">מי ממלאת</div>
          <div class="who" role="group" aria-labelledby="who-label">
            <button type="button" data-who="אורלי" aria-pressed="false">אורלי</button>
            <button type="button" data-who="עומר" aria-pressed="false">עומר</button>
          </div>
        </div>
      </div>
    </div>

    <p class="error" id="error" role="alert"></p>
  </div>

  <div class="dock" id="dock">
    <div class="dock-inner">
      <p class="raw" id="raw">סכום לפני הנחה: ₪0</p>
      <p class="discount-line" id="discount-line">הנחה: ₪0</p>
      <div class="sticker" id="sticker" aria-live="polite">המחיר למדבקה: ₪0</div>
      <button type="button" class="submit" id="submit">שליחת הדיווח</button>
    </div>
  </div>

  <div class="wrap success" id="success-view">
    <header class="top">
      <p class="brand">משתלת חבצלת</p>
      <span class="badge">דמו · מחירים לדוגמה</span>
      <h1 id="success-title">הדיווח מוכן</h1>
    </header>
    <div class="card">
      <ul class="summary" id="summary"></ul>
    </div>
    <p class="note-limit" id="save-note"></p>
    <button type="button" class="again" id="again">דיווח נוסף</button>
  </div>

  <script>
    (function () {
      const PRICES = { rose: 15, lisianthus: 15, greenery: 6 };
      const qty = { rose: 0, lisianthus: 0, greenery: 0 };
      let who = "";
      let lastCalculated = 0;
      let selectedPct = 0;
      let customMode = false;
      let reasonKey = "";

      const dateEl = document.getElementById("date");
      const finalEl = document.getElementById("final-price");
      const rawEl = document.getElementById("raw");
      const discountLineEl = document.getElementById("discount-line");
      const stickerEl = document.getElementById("sticker");
      const errorEl = document.getElementById("error");
      const customPctWrap = document.getElementById("custom-pct-wrap");
      const customPctEl = document.getElementById("custom-pct");
      const reasonBlock = document.getElementById("reason-block");
      const customReasonWrap = document.getElementById("custom-reason-wrap");
      const customReasonEl = document.getElementById("custom-reason");

      function todayISO() {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Jerusalem",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const map = {};
        parts.forEach(function (p) { map[p.type] = p.value; });
        return map.year + "-" + map.month + "-" + map.day;
      }

      function roundUp5(n) {
        if (n <= 0) return 0;
        return Math.ceil(n / 5) * 5;
      }

      function money(n) {
        if (Number.isInteger(n)) return String(n);
        return (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
      }

      function rawSum() {
        return qty.rose * PRICES.rose
          + qty.lisianthus * PRICES.lisianthus
          + qty.greenery * PRICES.greenery;
      }

      function currentPct() {
        if (customMode) {
          const n = Number(customPctEl.value);
          if (!customPctEl.value || Number.isNaN(n) || n < 0) return 0;
          return Math.min(100, n);
        }
        return selectedPct || 0;
      }

      function reasonText() {
        if (!reasonKey) return "";
        if (reasonKey === "אחר") return (customReasonEl.value || "").trim();
        return reasonKey;
      }

      function totals() {
        const raw = rawSum();
        const pct = currentPct();
        const discountAmt = raw * (pct / 100);
        const after = Math.max(0, raw - discountAmt);
        const calculated = roundUp5(after);
        return { raw: raw, pct: pct, discountAmt: discountAmt, after: after, calculated: calculated };
      }

      function updateReasonVisibility() {
        const pct = currentPct();
        reasonBlock.style.display = pct > 0 ? "block" : "none";
        if (pct <= 0) {
          reasonKey = "";
          customReasonEl.value = "";
          customReasonWrap.style.display = "none";
          document.querySelectorAll(".reason-chip").forEach(function (b) {
            b.setAttribute("aria-pressed", "false");
          });
        }
      }

      function renderTotals() {
        const t = totals();
        rawEl.textContent = "סכום לפני הנחה: ₪" + money(t.raw);
        if (t.pct > 0) {
          discountLineEl.textContent = "הנחה " + money(t.pct) + "%: ₪" + money(t.discountAmt);
        } else {
          discountLineEl.textContent = "הנחה: ₪0";
        }
        stickerEl.textContent = "המחיר למדבקה: ₪" + money(t.calculated);
        if (String(finalEl.value) === String(lastCalculated) || finalEl.value === "") {
          finalEl.value = t.calculated === 0 ? "" : String(t.calculated);
        }
        lastCalculated = t.calculated;
        updateReasonVisibility();
      }

      dateEl.value = todayISO();

      document.querySelectorAll(".who button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          who = btn.getAttribute("data-who");
          document.querySelectorAll(".who button").forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          errorEl.style.display = "none";
        });
      });

      document.querySelectorAll(".stem").forEach(function (row) {
        const key = row.getAttribute("data-stem");
        const qtyEl = row.querySelector(".qty");
        row.querySelector(".plus").addEventListener("click", function () {
          qty[key] += 1;
          qtyEl.textContent = String(qty[key]);
          renderTotals();
        });
        row.querySelector(".minus").addEventListener("click", function () {
          if (qty[key] === 0) return;
          qty[key] -= 1;
          qtyEl.textContent = String(qty[key]);
          renderTotals();
        });
      });

      document.querySelectorAll("#pct-chips .chip").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const val = btn.getAttribute("data-pct");
          const already = btn.getAttribute("aria-pressed") === "true";
          document.querySelectorAll("#pct-chips .chip").forEach(function (b) {
            b.setAttribute("aria-pressed", "false");
          });
          if (already) {
            selectedPct = 0;
            customMode = false;
            customPctWrap.style.display = "none";
            customPctEl.value = "";
          } else {
            btn.setAttribute("aria-pressed", "true");
            if (val === "custom") {
              customMode = true;
              customPctWrap.style.display = "block";
              selectedPct = 0;
              customPctEl.focus();
            } else {
              customMode = false;
              customPctWrap.style.display = "none";
              customPctEl.value = "";
              selectedPct = Number(val);
            }
          }
          renderTotals();
        });
      });

      customPctEl.addEventListener("input", function () { renderTotals(); });

      document.querySelectorAll(".reason-chip").forEach(function (btn) {
        btn.addEventListener("click", function () {
          reasonKey = btn.getAttribute("data-reason") || "";
          document.querySelectorAll(".reason-chip").forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          customReasonWrap.style.display = reasonKey === "אחר" ? "block" : "none";
          if (reasonKey !== "אחר") customReasonEl.value = "";
          errorEl.style.display = "none";
        });
      });

      function resetForm() {
        who = "";
        qty.rose = qty.lisianthus = qty.greenery = 0;
        lastCalculated = 0;
        selectedPct = 0;
        customMode = false;
        reasonKey = "";
        dateEl.value = todayISO();
        finalEl.value = "";
        document.getElementById("notes").value = "";
        customPctEl.value = "";
        customReasonEl.value = "";
        customPctWrap.style.display = "none";
        customReasonWrap.style.display = "none";
        reasonBlock.style.display = "none";
        document.querySelectorAll(".who button, #pct-chips .chip, .reason-chip").forEach(function (b) {
          b.setAttribute("aria-pressed", "false");
        });
        document.querySelectorAll(".stem .qty").forEach(function (el) { el.textContent = "0"; });
        errorEl.style.display = "none";
        renderTotals();
      }

      function payload() {
        const t = totals();
        const finalPrice = finalEl.value === "" ? t.calculated : Number(finalEl.value);
        return {
          timestamp: new Date().toISOString(),
          date: dateEl.value,
          who: who,
          rose: qty.rose,
          lisianthus: qty.lisianthus,
          greenery: qty.greenery,
          wrapping: t.pct > 0 ? String(t.pct) : "",
          raw: t.raw,
          calculated: t.calculated,
          finalPrice: finalPrice,
          notes: document.getElementById("notes").value.trim(),
          photo: t.pct > 0 ? reasonText() : "",
          photoDataUrl: "",
          discountPct: t.pct,
          discountAmount: t.discountAmt,
          reason: t.pct > 0 ? reasonText() : ""
        };
      }

      function showSuccess(data, savedToSheet) {
        const lines = [
          ["תאריך", data.date],
          ["מי מילאה", data.who],
          ["ורד אדום", String(data.rose)],
          ["ליזיאנטוס", String(data.lisianthus)],
          ["ירק", String(data.greenery)],
          ["סכום לפני הנחה", "₪" + money(data.raw)],
          ["הנחה", data.discountPct > 0 ? (money(data.discountPct) + "% · ₪" + money(data.discountAmount)) : "אין"],
          ["סיבת ההנחה", data.reason || ""],
          ["מחיר למדבקה", "₪" + money(data.calculated)],
          ["מחיר סופי על המדבקה", "₪" + money(data.finalPrice)]
        ];
        if (data.notes) lines.push(["הערות", data.notes]);
        const ul = document.getElementById("summary");
        ul.innerHTML = "";
        lines.forEach(function (pair) {
          if (pair[0] === "סיבת ההנחה" && !pair[1]) return;
          const li = document.createElement("li");
          const a = document.createElement("span");
          const b = document.createElement("span");
          a.textContent = pair[0];
          b.textContent = pair[1];
          li.appendChild(a);
          li.appendChild(b);
          ul.appendChild(li);
        });
        document.getElementById("success-title").textContent = savedToSheet ? "הדיווח נשמר" : "החישוב מוכן";
        document.getElementById("save-note").textContent = savedToSheet
          ? "השורה נכנסה לגיליון הדיווחים."
          : "החישוב עבד, אבל השורה לא נשמרה בגיליון.";
        document.getElementById("form-view").style.display = "none";
        document.getElementById("dock").style.display = "none";
        document.getElementById("success-view").style.display = "block";
        window.scrollTo(0, 0);
      }

      document.getElementById("submit").addEventListener("click", function () {
        const data = payload();
        if (!data.who) {
          errorEl.textContent = "צריך לבחור מי ממלאת: אורלי או עומר.";
          errorEl.style.display = "block";
          return;
        }
        if (data.rose + data.lisianthus + data.greenery === 0) {
          errorEl.textContent = "צריך לבחור לפחות ענף אחד.";
          errorEl.style.display = "block";
          return;
        }
        if (data.discountPct > 0 && !data.reason) {
          errorEl.textContent = reasonKey === "אחר"
            ? "צריך לכתוב את סיבת ההנחה."
            : "צריך לבחור סיבה להנחה.";
          errorEl.style.display = "block";
          return;
        }
        if (data.finalPrice === "" || Number.isNaN(Number(data.finalPrice))) {
          errorEl.textContent = "צריך למלא מחיר סופי למדבקה.";
          errorEl.style.display = "block";
          return;
        }
        errorEl.style.display = "none";
        const ENDPOINT = "https://script.google.com/macros/s/AKfycbx_rw-0YHxxMUjzj9jWMwgHt2yuS_n0qVqTIUBeFQWG_nuCkBcdkqJCp2GbyLt1gjA/exec";
        if (!ENDPOINT) {
          showSuccess(data, false);
          return;
        }
        const btn = document.getElementById("submit");
        btn.disabled = true;
        btn.textContent = "שולחת…";
        fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        }).then(function (res) {
          return res.ok ? showSuccess(data, true) : Promise.reject();
        }).catch(function () {
          errorEl.textContent = "השליחה לגיליון לא הצליחה. אפשר לנסות שוב.";
          errorEl.style.display = "block";
        }).finally(function () {
          btn.disabled = false;
          btn.textContent = "שליחת הדיווח";
        });
      });

      document.getElementById("again").addEventListener("click", function () {
        resetForm();
        document.getElementById("success-view").style.display = "none";
        document.getElementById("form-view").style.display = "block";
        document.getElementById("dock").style.display = "block";
        window.scrollTo(0, 0);
      });

      if (roundUp5(144 * 0.8) !== 120) {
        console.error("Rounding check failed");
      }

      renderTotals();
    })();
  </script>
</body>
</html>
